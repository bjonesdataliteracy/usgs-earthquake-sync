name: Snapshot 2026 Data

# Manually-triggered: refreshes data/earthquakes_2026.csv (the offline
# snapshot used by earthquake_analysis_2026.ipynb) and commits it back to
# the branch the workflow was run on.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch 2026 snapshot
        run: python snapshot_2026.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earthquakes_2026.csv
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to commit."
          else
            git commit -m "Refresh data/earthquakes_2026.csv snapshot"
            git push origin HEAD:${{ github.ref_name }}
          fi
