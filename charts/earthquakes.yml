_schema_version: "0.11.0"  # written automatically by dct migrate
title: "Earthquakes: the last 30 days"
source: supabase
style:
  charts:
    kpi:
      background: "dbt-grays.1"
      border:
        width: 1
        color: "dbt-grays.3"
        radius: 8
      default_height: 150
      align: center
      content_padding:
        top: 24
        bottom: 24
      value:
        font:
          size: 48

# Every query covers the 30 calendar days ending on the day of the most
# recent event in the table, so the board still shows data if the sync
# pauses for a while, and the first bar is never a partial day.

queries:
  summary:
    sql: |
      with recent as (
        select * from earthquakes
        where event_time >= (select date_trunc('day', max(event_time)) from earthquakes) - interval '29 days'
      )
      select
        count(*)                                   as total_quakes,
        count(*) filter (where magnitude >= 4.5)   as significant_quakes,
        max(magnitude)                             as strongest_magnitude
      from recent

  daily_by_band:
    sql: |
      select
        date_trunc('day', event_time)::date as day,
        case
          when magnitude >= 6   then '6+'
          when magnitude >= 4.5 then '4.5 to 6'
          when magnitude >= 2.5 then '2.5 to 4.5'
          else 'Under 2.5'
        end as magnitude_band,
        count(*) as quakes
      from earthquakes
      where event_time >= (select date_trunc('day', max(event_time)) from earthquakes) - interval '29 days'
      group by 1, 2
      order by 1, 2

  significant_locations:
    sql: |
      select latitude, longitude, magnitude, place
      from earthquakes
      where event_time >= (select date_trunc('day', max(event_time)) from earthquakes) - interval '29 days'
        and magnitude >= 4.5

  strongest:
    sql: |
      select
        event_time::date as date,
        magnitude,
        place,
        round(depth_km::numeric, 1) as depth_km,
        coalesce(alert, '') as alert
      from earthquakes
      where event_time >= (select date_trunc('day', max(event_time)) from earthquakes) - interval '29 days'
      order by magnitude desc nulls last
      limit 10

charts:
  total_kpi:
    type: kpi
    query: summary
    value: total_quakes
    label: "Magnitude 2.5+ earthquakes recorded"
    style:
      value:
        format: ",.0f"

  significant_kpi:
    type: kpi
    query: summary
    value: significant_quakes
    label: "Magnitude 4.5 or higher"
    style:
      value:
        format: ",.0f"

  strongest_kpi:
    type: kpi
    query: summary
    value: strongest_magnitude
    label: "Strongest magnitude (M2.5+ events)"
    style:
      value:
        format: ".1f"

  daily_trend:
    type: bar
    query: daily_by_band
    title: "Earthquakes per day, by magnitude"
    x: day
    y: quakes
    color: magnitude_band
    style:
      stack: zero

  quake_map:
    type: bubble_map
    query: significant_locations
    title: "Where the magnitude 4.5+ quakes struck"
    latitude: latitude
    longitude: longitude
    size: magnitude
    projection: equalEarth
    basemap:
      source: world-countries
      fill: "dbt-grays.1"
      stroke: "dbt-grays.4"
    style:
      marks:
        point:
          size: 16
          opacity: 0.4

  strongest_table:
    type: table
    query: strongest
    title: "The 10 strongest"
    style:
      columns:
        magnitude:
          format: ".1f"

rows:
  - cols: [total_kpi, significant_kpi, strongest_kpi]
  - daily_trend
  - cols: [quake_map, strongest_table]
